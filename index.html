<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Остров кубиков</title>
<style>

   IDEA: маленький остров из кубиков посреди моря — строй, ломай, гоняйся за зверушками
   PICTURE: сама 3D-сцена во весь экран; поверх только прицел, панель предметов и кнопки
   COLOUR and TYPE: небо, трава, море; системный шрифт (без внешних шрифтов — быстро открывается везде)
   LAYOUT: панель предметов снизу по центру, на сенсорных экранах джойстик слева и кнопки справа */
:root{--ui:rgba(20,36,52,.55);--acc:#ffd54a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#c{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.water{position:fixed;inset:0;background:rgba(30,90,170,.38);pointer-events:none;display:none}
.cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px;pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.cross::before{left:10px;top:0;width:2px;height:22px}.cross::after{top:10px;left:0;height:2px;width:22px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:4px;
padding:5px;background:var(--ui);border-radius:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:calc(100vw - 16px)}
.slot{all:unset;width:clamp(34px,7.4vw,56px);aspect-ratio:1;border-radius:11px;display:grid;place-items:center;cursor:pointer;position:relative;border:3px solid transparent}
.slot img{width:84%;image-rendering:pixelated;pointer-events:none}
.slot.on{border-color:var(--acc);background:rgba(255,255,255,.18)}
.slot span{position:absolute;left:4px;top:1px;font-size:11px;font-weight:700;opacity:.8}
.slot.all{background:rgba(255,255,255,.14)}
.slot.all svg{width:58%;pointer-events:none}
.touch .slot span{display:none}
.toast{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + clamp(56px,10vw,80px));transform:translateX(-50%);
background:var(--ui);padding:6px 14px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.tbtn{position:fixed;width:74px;height:74px;border-radius:50%;border:0;background:var(--ui);color:#fff;display:none;place-items:center;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
.tbtn svg{width:34px;height:34px}
.touch .tbtn{display:grid}
.touch .tbtn.hide{display:none}
#jump{right:max(22px,env(safe-area-inset-right));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 90px)}
#mode{right:max(22px,env(safe-area-inset-right));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 176px)}
#mode.place{background:rgba(255,180,40,.75)}
#menuBtn{display:grid;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:52px;height:52px;bottom:auto}
#menuBtn svg{width:26px;height:26px}
.touch .cross{display:none}
.stick{position:fixed;width:130px;height:130px;margin:-65px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:none;pointer-events:none}
.stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.75)}
.hint{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));font-size:13px;background:var(--ui);padding:6px 12px;border-radius:10px;pointer-events:none;max-width:60vw}
.score{position:fixed;left:max(14px,env(safe-area-inset-left));top:calc(max(12px,env(safe-area-inset-top)) + 40px);font-size:13px;font-weight:700;background:var(--ui);padding:5px 12px;border-radius:10px;pointer-events:none;display:none}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#6cc3ff 0%,#a9e3ff 55%,#7ccf6a 55.2%,#5fae4f 100%);z-index:5;overflow:auto}
.ov.dim{background:rgba(16,30,46,.6)}
.ov[hidden]{display:none}
.card{background:#fff;color:#1c2a36;border-radius:26px;padding:28px 30px;max-width:460px;width:100%;box-shadow:0 26px 60px -18px rgba(0,0,0,.45);text-align:center}
.card.wide{max-width:680px;padding:22px}
.card h1{font-size:clamp(32px,6vw,46px);line-height:1.05;margin:0 0 6px;font-weight:900;color:#2d6a2f}
.card h2{font-size:28px;margin:0 0 12px;font-weight:900}
.card p{margin:8px 0;color:#41505c}
.keys{text-align:start;margin:14px 0 20px;padding:12px 16px;background:#eef6e6;border-radius:14px;font-size:15px}
.keys div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.keys b{white-space:nowrap}
.big{all:unset;display:block;width:100%;padding:16px 0;margin-top:10px;border-radius:16px;font-weight:800;font-size:19px;background:#3f9a43;color:#fff;cursor:pointer;text-align:center}
.big.alt{background:#e9eef2;color:#1c2a36}
.big.warn{background:#d9534f;color:#fff}

.icons{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.icons img{width:40px;image-rendering:pixelated}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:6px 0 4px;max-height:62vh;overflow:auto;padding:2px}

.it img{width:44px;image-rendering:pixelated}
.it.cur{background:#ffe9a6}
.sub{font-size:14px;color:#5b6a75;margin:0 0 8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="water" id="uw"></div>
<div class="cross"></div>
<div class="hint" id="hint">Строй что хочешь</div>
<div class="score" id="score"></div>
<div class="bar" id="bar"></div>
<div class="toast" id="toast"></div>

<button class="tbtn" id="jump" aria-label="Прыжок"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<button class="tbtn" id="mode" aria-label="Режим: ломать или ставить"></button>
<button class="tbtn" id="menuBtn" aria-label="Меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>

<div class="ov" id="start">
 <div class="card">
  <h1>Остров кубиков</h1>

  <div class="keys" id="keys"></div>
  <button class="big" id="play">Играть</button>
 </div>
</div>
<div class="ov dim" id="menu" hidden>
 <div class="card">
  <h2>Пауза</h2>
  <button class="big" id="resume">Продолжить</button>
  <button class="big alt" id="newWorld">Новый остров</button>
  <p id="newNote" style="font-size:14px;min-height:1.4em"></p>
 </div>
</div>
<div class="ov dim" id="inv" hidden>
 <div class="card wide">
  <h2>Все предметы</h2>
  <p class="sub" id="invSub">Выбери, что положить в ячейку</p>
  <div class="grid" id="invGrid"></div>
  <button class="big alt" id="invClose">Закрыть</button>
 </div>
</div>

  setBlock(h.x,h.y,h.z,water?WATER:AIR);return}
 const x=h.x+h.n[0],y=h.y+h.n[1],z=h.z+h.n[2];
 if(!inb(x,y,z)||y<1)return;const cur=get(x,y,z);if(cur!==AIR&&cur!==WATER)return;
 const box={x:x+.5,y,z:z+.5,hw:.5,hh:1},hit=e=>x+1>e.x-e.hw&&x<e.x+e.hw&&y+1>e.y&&y<e.y+e.hh&&z+1>e.z-e.hw&&z<e.z+e.hw;
 if(hit(P)||animals.some(hit))return;
 setBlock(x,y,z,hotbar[slot])}
const colCache={};
function blockColor(t){if(colCache[t])return colCache[t];const d=img.data,tl=B[t].t[1];let r=0,g=0,b=0,n=0;
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){const i=(y*NT*16+tl*16+x)*4;if(d[i+3]<128)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++}
 return colCache[t]=n?(r/n<<16)|(g/n<<8)|(b/n|0):0xffffff}

/* ---------- оружие ---------- */
const held=new THREE.Group();camera.add(held);
const hb=(g,w,h,d,x,y,z,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c,depthTest:false,fog:false}));m.position.set(x,y,z);m.renderOrder=20;g.add(m);return m};
const swordM=new THREE.Group();
hb(swordM,.06,.56,.025,0,.34,0,0xe3e9ef);hb(swordM,.025,.56,.03,.02,.34,0,0xb8c3cc);hb(swordM,.04,.06,.025,0,.64,0,0xe3e9ef);
hb(swordM,.24,.05,.07,0,.05,0,0xd4a838);hb(swordM,.05,.18,.05,0,-.07,0,0x7a4f2c);hb(swordM,.07,.06,.07,0,-.17,0,0xd4a838);
swordM.position.set(.42,-.4,-.72);swordM.scale.setScalar(.8);swordM.rotation.set(-.35,.1,-.5);
const bowM=new THREE.Group();
for(let i=0;i<7;i++){const a=-1.1+i*(2.2/6);hb(bowM,.045,.13,.045,Math.cos(a)*.32-.32,Math.sin(a)*.34,0,0x8a5a32).rotation.z=a}
hb(bowM,.008,.62,.008,-.1,0,0,0xf2efe6);
const arrowM=new THREE.Group();hb(arrowM,.02,.02,.5,0,0,0,0x6d4a2a);hb(arrowM,.05,.05,.07,0,0,-.27,0xc9d1d8);arrowM.position.set(-.1,0,0);bowM.add(arrowM);
bowM.position.set(.34,-.28,-.6);bowM.rotation.set(.1,-.35,.15);
held.add(swordM,bowM);
let swing=0,cool=0;
function showHeld(){const t=hotbar[slot];swordM.visible=t===SWORD;bowM.visible=t===BOW;$('mode').classList.toggle('hide',isTool(t))}
const arrows=[],arrowGeo=new THREE.BoxGeometry(.04,.04,.6),arrowMat=new THREE.MeshLambertMaterial({color:0x7a5230});
function weaponAct(px,py){
 if(cool>0)return;const o=eye(),d=dirAt(px,py),t=hotbar[slot];
 if(t===SWORD){cool=.3;swing=1;const h=ray(o,d,3.4),an=rayAnimal(o,d,h?h.t:3.4);if(an)hurt(an,2,P.x,P.z);return}
 cool=.5;arrowM.visible=false;setTimeout(()=>arrowM.visible=true,350);
 const m=new THREE.Mesh(arrowGeo,arrowMat);m.position.copy(o).addScaledVector(d,.5);scene.add(m);
 arrows.push({m,v:d.clone().multiplyScalar(26),stuck:false,life:8})}
function updArrows(dt){
 for(let i=arrows.length-1;i>=0;i--){const a=arrows[i];a.life-=dt;
  if(!a.stuck){a.v.y-=12*dt;const st=4;
   for(let s=0;s<st;s++){a.m.position.addScaledVector(a.v,dt/st);const p=a.m.position;
    const an=animals.find(z=>p.x>z.x-z.hw-.1&&p.x<z.x+z.hw+.1&&p.z>z.z-z.hw-.1&&p.z<z.z+z.hw+.1&&p.y>z.y&&p.y<z.y+z.hh);
    if(an){hurt(an,2,p.x-a.v.x,p.z-a.v.z);a.life=0;break}
    const b=get(Math.floor(p.x),Math.floor(p.y),Math.floor(p.z));if(b&&b!==WATER){a.stuck=true;break}}
   if(!a.stuck)a.m.lookAt(a.m.position.clone().add(a.v))}
  if(a.life<=0||a.m.position.y<-5||Math.abs(a.m.position.x-SX/2)>120){scene.remove(a.m);arrows.splice(i,1)}}}

function act(place,px,py){if(isTool(hotbar[slot]))weaponAct(px,py);else blockAct(place,px,py)}

/* ---------- сохранение ---------- */
const KEY='kubiki-v1';let saveT=0;
const DEFAULT_HB=[GRASS,PLANKS,STONE,BRICK,GLASS,WRED,LAMP,SWORD,BOW];
let hotbar=DEFAULT_HB.slice(),slot=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({seed,e:[...edits].flat(),p:[P.x,P.y,P.z,P.yaw,P.pitch],slot,hb:hotbar}))}catch(e){}}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,700)}
let loaded=null;try{loaded=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(loaded&&loaded.seed){seed=loaded.seed;const e=loaded.e||[];for(let i=0;i+1<e.length;i+=2)edits.set(e[i],e[i+1]);
 if(Array.isArray(loaded.hb)&&loaded.hb.length===9&&loaded.hb.every(t=>ITEMS.includes(t)))hotbar=loaded.hb;slot=loaded.slot|0}
else seed=1+(Math.random()*1e6|0);

/* ---------- интерфейс ---------- */
let placeMode=false,tt=0;
function toast(s){const t=$('toast');t.textContent=s;t.classList.toggle('show',!!s);clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1400)}
const GRID_SVG='<svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>';
function drawBar(){$('bar').innerHTML=hotbar.map((t,i)=>`<button class="slot${i===slot?' on':''}" data-i="${i}" aria-label="${NAME(t)}"><img src="${ICON[t]}" alt=""><span>${i+1}</span></button>`).join('')+
 `<button class="slot all" id="allBtn" aria-label="Все предметы">${GRID_SVG}</button>`}
function pick(i,quiet){slot=(i+9)%9;document.querySelectorAll('.slot[data-i]').forEach((b,j)=>b.classList.toggle('on',j===slot));showHeld();if(!quiet)toast(NAME(hotbar[slot]));saveSoon()}
$('bar').addEventListener('pointerdown',e=>{e.stopPropagation();const b=e.target.closest('.slot');if(!b)return;
 if(b.id==='allBtn'){openInv();return}
 pick(+b.dataset.i);if(isTouch&&!placeMode&&!isTool(hotbar[slot]))setMode(true)});
$('icons').innerHTML=[GRASS,BRICK,WRED,LAMP,PUMPKIN,SWORD,BOW].map(t=>`<img src="${ICON[t]}" alt="">`).join('');
let invOpen=false;
function openInv(){invOpen=true;paused=true;if(document.pointerLockElement)document.exitPointerLock();
 $('invSub').textContent='Выбери, что положить в ячейку '+(slot+1);
 $('invGrid').innerHTML=ITEMS.map(t=>`<button class="it${t===hotbar[slot]?' cur':''}" data-t="${t}"><img src="${ICON[t]}" alt="">${NAME(t)}</button>`).join('');
 $('inv').hidden=false}
function closeInv(){$('inv').hidden=true;invOpen=false;resume()}
$('invGrid').addEventListener('click',e=>{const b=e.target.closest('.it');if(!b)return;const t=+b.dataset.t;
 const j=hotbar.indexOf(t);if(j>=0&&j!==slot)hotbar[j]=hotbar[slot];hotbar[slot]=t;drawBar();showHeld();toast(NAME(t));saveSoon();closeInv()});
$('invClose').onclick=closeInv;
const ICON_BREAK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4c3 0 6 2 7 5-2.5-1.5-5-2-7-1.5M14 4c-3 0-6 2-7 5 2.5-1.5 5-2 7-1.5M14 7.5 4 20"/></svg>';
const ICON_PLACE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>';
function setMode(p,quiet){placeMode=p;const m=$('mode');m.innerHTML=p?ICON_PLACE:ICON_BREAK;m.classList.toggle('place',p);if(!quiet)toast(p?'Ставить: '+NAME(hotbar[slot]):'Ломать')}
$('mode').addEventListener('pointerdown',e=>{e.stopPropagation();setMode(!placeMode)});
$('jump').addEventListener('pointerdown',e=>{e.stopPropagation();jumpHeld=true});
for(const ev of['pointerup','pointercancel','pointerleave'])$('jump').addEventListener(ev,()=>jumpHeld=false);
$('keys').innerHTML=(isTouch?[['Ходить','джойстик слева'],['Смотреть','веди пальцем справа'],['Ломать или ставить','коснись блока'],['Сменить режим','кнопка с киркой'],['Меч и лук','выбери внизу и коснись цели'],['Все блоки','кнопка с квадратиками'],['Прыжок','кнопка со стрелкой']]
 :[['Ходить','W A S D'],['Бежать','Shift'],['Прыжок, плыть вверх','Пробел'],['Ломать или ударить','левая кнопка мыши'],['Ставить','правая кнопка мыши'],['Выбрать предмет','1–9 или колесо'],['Все блоки','E'],['Пауза','Esc']])
 .map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
$('hint').textContent=isTouch?'Коснись блока, чтобы ломать или ставить':'Левая кнопка — ломать, правая — ставить, E — все блоки';

let started=false,paused=true,locked=false,dragLook=isTouch;
function resume(){$('start').hidden=true;$('menu').hidden=true;started=true;paused=false;
 if(!isTouch&&!dragLook){try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{dragLook=true})}catch(e){dragLook=true}}}
$('play').onclick=()=>{resume();setTimeout(()=>$('hint').style.display='none',7000)};$('resume').onclick=resume;
$('menuBtn').addEventListener('pointerdown',e=>e.stopPropagation());
$('menuBtn').onclick=()=>{if(document.pointerLockElement)document.exitPointerLock();pause()};
let armed=false;
function pause(){paused=true;save();$('menu').hidden=false;$('newNote').textContent='';armed=false;$('newWorld').className='big alt';$('newWorld').textContent='Новый остров'}
$('newWorld').onclick=()=>{
 if(!armed){armed=true;$('newWorld').className='big warn';$('newWorld').textContent='Да, создать новый';$('newNote').textContent='Всё построенное на этом острове пропадёт';return}
 seed=1+(Math.random()*1e6|0);edits.clear();generate();buildAll();spawn();
 for(const a of animals.splice(0))scene.remove(a.g);populate(false);save();resume()};
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;if(!locked&&started&&!paused&&!dragLook&&!invOpen)pause()});
document.addEventListener('pointerlockerror',()=>{dragLook=true});

addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();
 if(/^Digit[1-9]$/.test(e.code))pick(+e.code[5]-1);
 if(e.code==='KeyE'&&started){if(invOpen)closeInv();else if(!paused)openInv()}
 if(e.code==='Escape'&&invOpen)closeInv();else if(e.code==='Escape'&&started&&!paused&&dragLook)pause()});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;jumpHeld=false});
addEventListener('wheel',e=>{if(started&&!paused)pick(slot+(e.deltaY>0?1:-1))},{passive:true});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('mousemove',e=>{if(!locked||paused)return;P.yaw-=e.movementX*.0024;P.pitch=Math.max(-1.55,Math.min(1.55,P.pitch-e.movementY*.0024))});

const ptr=new Map();let stickId=null,stickO=null;
const stick=$('stick'),knob=stick.firstElementChild;
canvas.addEventListener('pointerdown',e=>{
 if(!started||paused)return;
 if(locked){act(e.button===2);return}
 canvas.setPointerCapture?.(e.pointerId);
 if(e.pointerType!=='mouse'&&stickId===null&&e.clientX<innerWidth*.42&&e.clientY>innerHeight*.3){
  stickId=e.pointerId;stickO=[e.clientX,e.clientY];stick.style.display='block';stick.style.left=e.clientX+'px';stick.style.top=e.clientY+'px';knob.style.transform='';return}
 ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:0,btn:e.button})});
canvas.addEventListener('pointermove',e=>{
 if(e.pointerId===stickId){let dx=e.clientX-stickO[0],dy=e.clientY-stickO[1];const l=Math.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}
  knob.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/m;joy.y=-dy/m;return}
 const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;p.moved+=Math.abs(dx)+Math.abs(dy);
 const k=e.pointerType==='mouse'?.005:.0065;P.yaw-=dx*k;P.pitch=Math.max(-1.55,Math.min(1.55,P.pitch-dy*k))});
function up(e){
 if(e.pointerId===stickId){stickId=null;joy.x=joy.y=0;stick.style.display='none';return}
 const p=ptr.get(e.pointerId);if(!p)return;ptr.delete(e.pointerId);
 if(e.type==='pointerup'&&p.moved<12&&performance.now()-p.t<500){
  const place=e.pointerType==='mouse'?p.btn===2:placeMode;act(place,p.sx,p.sy)}}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);

/* ---------- запуск ---------- */
generate();buildAll();
if(loaded?.p){[P.x,P.y,P.z,P.yaw,P.pitch]=loaded.p;if(overlaps(P).length||!(P.y>-5))spawn()}else spawn();
populate(false);
drawBar();pick(slot,true);setMode(false,true);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now(),saveClock=0;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(started&&!paused){physics(dt);for(const a of animals.slice())updAnimal(a,dt);
  for(const a of animals.slice())if(a.y<-50){scene.remove(a.g);animals.splice(animals.indexOf(a),1);setTimeout(()=>populate(true),5000)}
  updArrows(dt);cool-=dt;saveClock+=dt;if(saveClock>5){saveClock=0;save()}}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy-=12*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
  p.m.material.opacity=Math.max(0,p.life*1.4);if(p.life<=0){scene.remove(p.m);p.m.material.dispose();parts.splice(i,1)}}
 swing=Math.max(0,swing-dt*4);swordM.rotation.x=-.35-Math.sin(swing*Math.PI)*1.3;
 const bob=Math.hypot(P.vx,P.vz)>.5&&P.ground?Math.sin(now/110)*.012:0;held.position.y=bob;
 camera.position.set(P.x,P.y+EYE,P.z);camera.rotation.set(P.pitch,P.yaw,0);
 clouds.children.forEach(c=>{c.position.x+=dt*.8;if(c.position.x>112)c.position.x=-48});
 const h=!isTouch&&!isTool(hotbar[slot])?ray(camera.position,dirAt()):null;
 sel.visible=!!h;if(h)sel.position.set(h.x+.5,h.y+.5,h.z+.5);
 $('uw').style.display=waterAt(P.x,P.y+EYE,P.z)?'block':'none';
 renderer.render(scene,camera);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.__kub={act,P,get,setBlock,animals,hurt,get hotbar(){return hotbar},pick,openInv};
}
